services:
  # Strapi application
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techmind-strapi
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      NODE_ENV: production
    volumes:
      - ../uploads:/app/public/uploads
      - ../data:/app/data/uploads
      - ../database:/app/.tmp
    ports:
      - "1338:1337"
    networks:
      - strapi-network

networks:
  strapi-network:
    driver: bridge

# Note: Using bind mounts instead of named volumes
# Data is stored outside the repository in parent directory
